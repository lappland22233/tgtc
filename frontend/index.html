<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0E17" />
    <meta name="color-scheme" content="dark" />
    <title>文件分发系统</title>

    <!--
      Content-Security-Policy（XSS 兜底防护）：
      - default-src 'self'：默认仅允许同源资源
      - script-src 'self' + 字体加载内联事件的精确哈希（不允许任意内联脚本）
      - style-src 'unsafe-inline'：TDesign 与运行时主题大量使用内联 style，必须放行；
        额外允许 fonts.googleapis.com 的字体样式表
      - font-src：允许 fonts.gstatic.com 字体文件与 data: 内联字体/图标
      - img-src：允许 data:（favicon/占位图）与 blob:（上传预览 ObjectURL）
      - connect-src：同源 API + ws:/wss:（Vite HMR WebSocket）
      - object-src 'none' / base-uri 'self'：关闭插件嵌入与 base 注入面
      注意：字体 onload 内联属性必须与下方哈希对应的脚本内容完全一致，修改需重算哈希。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-eOcoZqh8pP0qUd41Lu2w/Pq/ao1wfGf5RKErKPEVuwM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
    />

    <!-- Preconnect to critical third-party origins（非阻塞资源提示，不可达时快速失败不影响首屏） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      字体非阻塞加载（media=print + onload 切换，onload 脚本已被上方 CSP 哈希白名单放行）。
      国内部署提示：Google Fonts 在国内常不可达。该加载方式为非阻塞，不可达时仅回退系统字体，
      不会卡首屏；如需完整字体体验，建议：
        1) 将字体文件本地化到 public/fonts 并改用本地 @font-face；或
        2) 替换为国内可达镜像（如 https://fonts.loli.net，需同步调整 CSP 白名单）。
      已移除原先硬编码版本的 woff2 preload（Google 更新版本后会 404，且阻塞性预取浪费带宽）。
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <!-- Fallback for browsers that don't fire onload on link -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>

    <!-- Inline critical dark-theme background to prevent white flash（CSP style-src 'unsafe-inline' 已放行） -->
    <style>
      html { background-color: #0A0E17; color-scheme: dark; }
      body { margin: 0; background-color: #0A0E17; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
