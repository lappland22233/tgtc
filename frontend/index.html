<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0E17" />
    <meta name="color-scheme" content="dark" />
    <!-- 不向跨源携带 Referer，防止分享 token 等凭证通过 referrer 泄露（G13-05） -->
    <meta name="referrer" content="no-referrer" />
    <title>文件分发系统</title>

    <!--
      Content-Security-Policy（XSS 纵深防护）：
      - default-src 'self'，脚本仅允许同源及 Turnstile / Cloudflare Insights
      - style-src 保留 unsafe-inline 以支持 TDesign 与运行时主题
      - connect-src 限定同源与明确列出的 Cloudflare/Turnstile 端点，不允许任意 WebSocket host
      - Vite 开发 HMR 的 ws localhost 规则仅由开发服务器响应头注入，不进入生产 HTML
      - 对生产 Cloudflare Analytics 的额外端点须在部署配置中按需明确加入，不放开通配来源
    -->
    <!-- 基础 CSP 由受版本控制的 response header 下发（详见 frontend CSP 配置）；
         meta 仅作为静态/开发服务器场景的收紧兜底，不覆盖该 response header。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://challenges.cloudflare.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' https://challenges.cloudflare.com https://cloudflareinsights.com https://*.cloudflareinsights.com; frame-src 'self' https://challenges.cloudflare.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />

    <!-- 首屏深色背景，避免白屏闪烁；使用静态文件以避免 Vite HTML 内联 CSS 代理问题。 -->
    <link rel="stylesheet" href="/critical.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
