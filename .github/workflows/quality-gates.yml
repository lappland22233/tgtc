name: Quality gates

on:
  pull_request:
  push:
    branches:
      - beta
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Node 20 / PostgreSQL 16 / Redis 7
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: file_distribution_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d file_distribution_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      CI: true
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: file_distribution_ci
      DB_SSL: "false"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      TELEGRAM_BOT_TOKEN: 000000000:ci-placeholder
      TELEGRAM_CHAT_ID: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate dependency tree
        run: npm ls --all

      - name: Block high and critical production advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Smoke-test the complete forward migration chain on an empty database
        run: npm run migration:run

      - name: Verify no forward migrations remain pending
        shell: bash
        run: |
          output="$(npx typeorm-ts-node-commonjs migration:show -d src/database/data-source.ts)"
          printf '%s\n' "$output"
          if grep -Fq '[ ]' <<< "$output"; then
            echo 'Pending migrations remain after migration smoke test' >&2
            exit 1
          fi

      - name: Verify a second forward migration run is a no-op
        run: npm run migration:run

      # 迁移成功 ≠ 插入成功：api_keys.id 默认值缺陷（生产 23502）只能靠
      # 真实 PG 插入路径暴露。开关显式注入，套件内不设条件跳过以外的降级路径。
      - name: Run PostgreSQL api_keys.id regression against a real database
        env:
          PG_API_KEY_IT: "1"
        run: |
          test -f src/database/postgres-api-key.integration.spec.ts
          npm run test:integration:pg

      - name: Run SQLite migration and real-file integration release gate
        run: npm run gate:sqlite

      - name: Run tests and enforce configured coverage thresholds
        run: npm run test:cov -- --runInBand

      - name: Upload backend coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend / Node 20
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate dependency tree
        run: npm ls --all

      - name: Block high and critical production advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Build from a clean checkout
        run: npm run build

      - name: Require a frontend coverage test command
        run: node -e "const scripts=require('./package.json').scripts||{}; if (!scripts['test:cov']) throw new Error('frontend package.json must define a blocking test:cov script')"

      - name: Run frontend tests and publish baseline coverage
        run: npm run test:cov

  release-scripts:
    name: Release scripts / static safety gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Parse and lint release scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          scripts=(scripts/build-linux-x64-release.sh scripts/release/*.sh)
          bash -n "${scripts[@]}"
          shellcheck --severity=warning "${scripts[@]}"
          old_script_path='.codebuddy/'scripts
          ! grep -RIn --exclude-dir=.git --exclude-dir=.codebuddy --exclude='*.md' -- "$old_script_path" scripts .github README.md

      - name: Run release script regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          tests=(scripts/release/tests/*.test.sh)
          bash -n "${tests[@]}"
          shellcheck --severity=warning "${tests[@]}"
          for test_file in "${tests[@]}"; do
            printf '==> %s\n' "$test_file"
            bash "$test_file"
          done

      - name: Enforce release payload state exclusions
        shell: bash
        run: |
          set -Eeuo pipefail
          ! grep -Eq 'mkdir -p .*telegram-bot-api/data|cp .*telegram-bot-api/data' scripts/build-linux-x64-release.sh
          grep -Fq 'assert_no_protected_payload' scripts/release/upgrade.sh
          grep -Fq 'assert_no_protected_payload' scripts/release/rollback.sh
          # M4：回滚脚本必须消费发布清单的程序回退安全标志。
          grep -Fq 'require_rollback_safe' scripts/release/rollback.sh
          grep -Fq 'release_rollback_safe_flag' scripts/release/common.sh
          grep -Fq 'sha256sum' scripts/release/validate-release.sh
          grep -Fq 'zip --quiet' scripts/build-linux-x64-release.sh
          grep -Fq 'unzip -q' scripts/release/upgrade.sh
          # B2：清单标志的单一事实来源必须存在，且两条流水线都引用它（防止再次漏改打包入口）。
          test -s scripts/release/release-flags.env
          grep -Fq 'release-flags.env' .github/workflows/quality-gates.yml
          grep -Fq 'release-flags.env' .github/workflows/release.yml
          # B3：验签公钥必须统一经 resolve_verify_public_key 解析，禁止脚本各自硬编码公钥路径。
          grep -Fq 'resolve_verify_public_key' scripts/release/common.sh
          grep -Fq 'resolve_verify_public_key' scripts/release/validate-release.sh
          grep -Fq 'resolve_verify_public_key' scripts/release/sign-release.sh
          bash scripts/release/check-version.sh

  release-package:
    name: Release package / Linux x64 ZIP
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends build-essential cmake gperf libssl-dev zlib1g-dev zip unzip rsync xz-utils openssl

      - name: Build and validate ZIP release package
        shell: bash
        run: |
          set -Eeuo pipefail
          # 清单标志的唯一事实来源：与 release.yml 共用 scripts/release/release-flags.env。
          # 任一入口漏设 RELEASE_INCLUDES_DB_MIGRATION / RELEASE_ROLLBACK_SAFE 都会触发
          # generate-manifest.sh 的 fail-closed（die EXIT_PRECHECK=3）而使本 job 变红。
          set -a
          . scripts/release/release-flags.env
          set +a
          # quality-gates 在 pull_request（含 fork PR）上运行，拿不到 RELEASE_SIGNING_KEY secret，
          # 因此生成本次运行专用的临时密钥对，并用 RELEASE_VERIFY_PUBLIC_KEY 让
          # sign-release.sh 自检与 validate-release.sh 验签都指向该临时公钥，
          # 从而在 CI 上完整覆盖「签名 → 长度断言 → 验签 → 清单一致性」全链路。
          # 该覆盖在 GITHUB_REF_TYPE=tag 时被硬拒绝（common.sh#resolve_verify_public_key），
          # 且 release.yml 不设置该变量，正式发布路径行为不变。
          umask 077
          private_key="$RUNNER_TEMP/ci-release-private.pem"
          public_key="$RUNNER_TEMP/ci-release-public.pem"
          openssl genrsa -out "$private_key" 3072
          openssl rsa -in "$private_key" -pubout -out "$public_key"
          export RELEASE_SIGNING_KEY_PATH="$private_key"
          export RELEASE_VERIFY_PUBLIC_KEY="$public_key"
          bash scripts/build-linux-x64-release.sh
          version="$(tr -d '\r\n' < VERSION)"
          release_dir=".Releases/v${version}"
          archive="$release_dir/tgtc-v${version}-linux-x64.zip"
          bash scripts/release/validate-release.sh "$archive" "$release_dir/SHA256SUMS"
          # CI 也必须产出签名，防止签发环节被静默降级（私钥未生效时构建脚本只告警不签名）。
          test -s "$release_dir/SHA256SUMS.sig"
          test -s "$release_dir/release-manifest.json"
          # 清单版本必须与 VERSION 一致（validate-release.sh 已做全量校验，此处显式保底）。
          node -e 'const fs = require("fs"); const v = process.argv[1]; const m = JSON.parse(fs.readFileSync(process.argv[2], "utf8")); if (m.version !== v) throw new Error(`清单版本 ${m.version} 与 VERSION ${v} 不一致`);' \
            "$version" "$release_dir/release-manifest.json"
          zipinfo -1 "$archive" | grep -Fqx "tgtc-v${version}-linux-x64/VERSION"

  telegram-bot-api:
    name: C++ / GCC / CMake / CTest
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: telegram-bot-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends build-essential cmake gperf libssl-dev zlib1g-dev

      - name: Configure
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build server and tests
        run: cmake --build build-ci --config Release --parallel 2

      # 阻塞门禁仅覆盖 fork 自有的确定性测试；TDLib 上游 run_all_tests 套件
      # 含线程/时序敏感用例，在本 job 首跑即失败，不作为 fork 的阻塞门禁，
      # 降级为 continue-on-error 信息性步骤保留信号。
      - name: Run fork-owned CTest tests (blocking gate)
        run: ctest --test-dir build-ci --build-config Release --output-on-failure --no-tests=error -R 'test-(file-stream|workdir-cleanup)'

      - name: Run upstream TDLib test suite (informational, non-blocking)
        continue-on-error: true
        run: ctest --test-dir build-ci --build-config Release --output-on-failure -R 'run_all_tests'
